# =============================================================================
#  E-commerce Backend — local stack
# =============================================================================
#  Brings up PostgreSQL, Redis and the application together:
#
#      docker compose up --build
#
#  Credentials come from `.env` (generated by scripts/provision-db.sh and
#  git-ignored). Nothing here contains a real secret, and none of the values
#  below have defaults that would quietly start an insecure stack.
#
#  WARNING: `docker compose down -v` deletes the named volumes, and with them the
#  database. Use plain `docker compose down` to stop the stack and keep the data.
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: ${ECOMMERCE_DB_USERNAME:?set ECOMMERCE_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${ECOMMERCE_DB_PASSWORD:?set ECOMMERCE_DB_PASSWORD in .env}
      # Deterministic collation, so ORDER BY and the functional lower() indexes
      # behave identically on every machine.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Bound to localhost only. "5432:5432" would publish the database on every
      # interface, which on a laptop on a café network means exactly that.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready, not a TCP check: the port accepts connections several seconds
      # before the server will answer queries, and the application would start,
      # fail to migrate and exit.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    # appendonly keeps the cache across restarts. Not required for correctness —
    # a cold cache is only slower — but it makes a restart less of a thundering
    # herd against the database.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    depends_on:
      postgres:
        # service_healthy, not service_started. Without it the application races
        # the database, Flyway fails to connect and the container exits.
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # `postgres` and `redis` are the compose service names, resolved on the
      # shared network. Not localhost — inside a container that is the container.
      ECOMMERCE_DB_URL: jdbc:postgresql://postgres:5432/ecommerce_db
      ECOMMERCE_DB_USERNAME: ${ECOMMERCE_DB_USERNAME:?set ECOMMERCE_DB_USERNAME in .env}
      ECOMMERCE_DB_PASSWORD: ${ECOMMERCE_DB_PASSWORD:?set ECOMMERCE_DB_PASSWORD in .env}
      ECOMMERCE_REDIS_HOST: redis
      ECOMMERCE_REDIS_PORT: 6379
      ECOMMERCE_JWT_SECRET: ${ECOMMERCE_JWT_SECRET:?set ECOMMERCE_JWT_SECRET in .env}
      ECOMMERCE_ADMIN_EMAIL: ${ECOMMERCE_ADMIN_EMAIL:-}
      ECOMMERCE_ADMIN_PASSWORD: ${ECOMMERCE_ADMIN_PASSWORD:-}
      ECOMMERCE_PAYMENT_OUTCOME: ${ECOMMERCE_PAYMENT_OUTCOME:-SUCCESS}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
    name: ecommerce-postgres-data
  redis-data:
    name: ecommerce-redis-data
