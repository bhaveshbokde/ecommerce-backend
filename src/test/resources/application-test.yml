# =============================================================================
#  Integration-test configuration
# =============================================================================
#  Active for every @SpringBootTest in this project (see AbstractIntegrationTest).
#
#  Points at ecommerce_test_db, a SEPARATE database from the development one.
#  Sharing a database between a running application and a test suite that
#  truncates tables between classes is a reliable way to lose work you were in
#  the middle of.
#
#  No credentials live here. They come from ./.env, which is generated by
#  scripts/provision-db.sh and is git-ignored — the same file the application
#  itself reads, imported below by the same mechanism.
# =============================================================================
spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    # Falls back to the development URL's host and port with the test database
    # name, so a checkout that has run provision-db.sh needs no extra setup.
    url: ${ECOMMERCE_TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/ecommerce_test_db}
    username: ${ECOMMERCE_DB_USERNAME:ecommerce_app}
    password: ${ECOMMERCE_DB_PASSWORD}
    hikari:
      pool-name: ecommerce-test-pool
      # Larger than the default so the concurrency tests can actually run
      # concurrently. A pool of 10 would serialise 20 contending threads at the
      # connection layer and the test would pass for the wrong reason — it would
      # be measuring the pool, not the database's row locking.
      maximum-pool-size: 30
      minimum-idle: 5

  jpa:
    hibernate:
      # Flyway owns the schema here exactly as in production. Using create-drop
      # for tests would mean the suite validates Hibernate's idea of the schema
      # rather than the migrations that will actually run.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

ecommerce:
  jwt:
    # A fixed, well-known test key. Safe to commit precisely because it is
    # worthless: it signs nothing outside this suite, and the tests need a
    # deterministic value. The real key comes from .env and is never in Git.
    secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5vdC1hLXNlY3JldC0zMi1ieXRlcyE=
    issuer: ecommerce-backend
    access-token-ttl: PT30M
    refresh-token-ttl: P7D

  cache:
    # Off by default so the bulk of the suite needs no Redis. The tests that do
    # exercise caching are tagged @Tag("redis") and turn it back on themselves.
    enabled: false

  payment:
    # Deterministic. Tests that want a failure ask for one per request.
    default-outcome: SUCCESS
    simulated-latency: PT0S

  admin:
    # No administrator is bootstrapped; tests that need one create it directly,
    # so there is no committed credential and no dependency on .env contents.
    email: ""
    password: ""

logging:
  level:
    root: WARN
    com.bhavesh.ecommerce: INFO
    org.springframework.test: WARN
    org.hibernate.SQL: WARN
