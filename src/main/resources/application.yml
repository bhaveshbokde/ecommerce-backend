spring:
  application:
    name: ecommerce-backend

  # Loads KEY=VALUE pairs from ./.env (generated by scripts/provision-db.sh).
  # `.env` is .properties-shaped, so Spring's native config import handles it and
  # no dotenv dependency is needed. Absent file => ignored (CI uses real env vars).
  #
  # NOTE: this resolves relative to the WORKING DIRECTORY, not the jar. If you run
  # from an IDE, the run configuration's working directory must be the project
  # root or none of these values resolve. See README.md.
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${ECOMMERCE_DB_URL:jdbc:postgresql://127.0.0.1:5432/ecommerce_db}
    username: ${ECOMMERCE_DB_USERNAME:ecommerce_app}
    password: ${ECOMMERCE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ecommerce-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000      # fail fast rather than hanging a request thread
      max-lifetime: 1800000
      validation-timeout: 3000

  jpa:
    # Flyway is the single source of truth for the schema. `validate` makes the
    # application refuse to start if an entity mapping drifts from the migrations.
    # Never `update` or `create-drop` — see docs/ARCHITECTURE.md.
    hibernate:
      ddl-auto: validate
    # OSIV pins a database connection to the request thread for the whole request,
    # including JSON serialisation. It exhausts the pool under load and hides N+1
    # queries behind lazy loads that silently succeed. Off.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC             # every Instant round-trips as UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true             # `flyway:clean` can never run against this config

  data:
    redis:
      host: ${ECOMMERCE_REDIS_HOST:localhost}
      port: ${ECOMMERCE_REDIS_PORT:6379}
      password: ${ECOMMERCE_REDIS_PASSWORD:}
      timeout: 2s                    # a slow cache must not slow the request
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1

  cache:
    type: redis

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: false                 # JDBC-bound workload; the pool is the real limit

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never           # never leak internals through the default error page
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  shutdown: graceful

# ---------------------------------------------------------------- application --
ecommerce:
  jwt:
    secret: ${ECOMMERCE_JWT_SECRET}
    issuer: ${ECOMMERCE_JWT_ISSUER:ecommerce-backend}
    access-token-ttl: ${ECOMMERCE_JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${ECOMMERCE_JWT_REFRESH_TTL:P7D}
    clock-skew: PT30S

  cache:
    enabled: ${ECOMMERCE_CACHE_ENABLED:true}
    product-ttl: PT10M
    category-ttl: PT30M

  payment:
    # The simulated provider's default outcome. Tests and the development
    # callback endpoint override it explicitly; nothing here is random, because a
    # random outcome makes a test suite flaky and a demo unreproducible.
    default-outcome: ${ECOMMERCE_PAYMENT_OUTCOME:SUCCESS}
    simulated-latency: PT0S

  # Development administrator. Created once at startup ONLY when both values are
  # present AND the active profile is not `prod`. No credential is committed;
  # scripts/provision-db.sh generates one into .env.
  admin:
    email: ${ECOMMERCE_ADMIN_EMAIL:}
    password: ${ECOMMERCE_ADMIN_PASSWORD:}

  cors:
    allowed-origins: ${ECOMMERCE_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# --------------------------------------------------------------- observability --
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true                # /actuator/health/liveness + /readiness
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ecommerce-backend

info:
  app:
    name: E-commerce Backend
    description: Catalogue, cart, checkout, inventory and simulated payments
    version: 1.0.0

# ------------------------------------------------------------------- openapi --
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.bhavesh.ecommerce: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%X{traceId:-},%X{userId:-}]){magenta} %clr(%-40.40logger{39}){cyan} : %m%n%wEx"

---
# =====================================================================
#  prod profile — safe defaults for a real deployment
# =====================================================================
spring:
  config:
    activate:
      on-profile: prod

ecommerce:
  admin:
    # Bootstrapping an administrator from environment variables is a development
    # convenience. Under `prod` it is disabled unconditionally, so a leaked
    # ECOMMERCE_ADMIN_PASSWORD cannot mint an administrator in production.
    email: ""
    password: ""

logging:
  level:
    com.bhavesh.ecommerce: INFO
